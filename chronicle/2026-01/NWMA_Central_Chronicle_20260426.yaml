# 🧭 統治憲章：レビュー三軸方針 (Governance Policy / GP-001)
governance_policy:
  principles:
    - "技術的誠実さ: 正常系だけでなく、異常系および権限拒絶（403）を正しく合格と定義すること。"
    - "責任の所在: Owner/Architect/Builder/Operator の役割を分離し、主権をOwnerに帰属させること。"
    - "例外の統治: 野良設定を認めず、全ての例外を『有効期限付きポリシー』として管理下に置くこと。"

