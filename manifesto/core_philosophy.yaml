version: "2026.04.26"
project: NWMA (Net Worth Management Architecture)
japanese_name: "IT資産価値管理方式"
author_profile: "プラットフォームアーキテクト、インフラエンジニア"
status: "LOCKED" # 統治プロトコルの最終確定

# 核心的思想
core_philosophy:
  statement: "SLAを自動執行しない設計は未完成であり、責任境界なき運用は資産の汚染である"
  goal: "効率化によって失われた設計の『判断』と『意味』を取り戻し、価値を保存し続ける"
  governance: "人間を単純な調整から解放し、数学的な誠実さと『物理的な拒絶（403）』による統治をシステムに義務付ける"

# 統治階層の定義
architecture_layers:
  NWMA (The Constitution):
    role: "最上位の設計憲法・判断基準の策定"
    responsibility: "A/B/Cシートの整合性担保、および『責任主権(Ownership)』の確立"
    action: "Owner/Architect/Builder/Operator の職務を分離し、権限の私物化を許さない"
    in_short: "10年後、誰もが『この設計思想があるから、今もこの資産は清潔だ』と確信できる統治の仕組み"

  Nexus (The Enforcer):
    role: "NWMAプロトコルの自動執行および合意形成プラットフォーム"
    responsibility: "三者対話による『Why』の抽出、および例外ポリシー(A-303)の有効期限監視"
    action: "Gemini Flash をエンジンとし、設計者の思考をデータモデルへ変換。ドリフト検知時はIaCによる強制修復を指示する"

# 用語定義の昇華 (プロの是正に基づく)
terminology_definition:
  Asset (永続資産):
    definition: "削除保護および不変性を強制されるデータ層。器の再生成に依存せず存続する『資産の核』。"
  Vessel (計算資源):
    definition: "使い捨て・再生成可能なリソース層。状態を持たず、SLO(A-200)に基づき自律的に置換・拡張される。"
  Control (制御・執行):
    definition: "同一性検証(Identity)に基づくアクセス制御。例外設定を『野良』にせず、期限付きポリシーとして管理する権限層。"
  Why (設計判断理由):
    definition: "『なぜ別の構成ではダメなのか』を証明する論理。レビューにおける必勝の武器であり、将来の負債化を防ぐ防腐剤。"

# 統治プロトコル (Governance Policy)
governance_policy:
  GP-001_review_standards:
    - "技術的誠実さ: 異常系（Fail時アクション）が定義されていること。拒絶されるべきアクセスが物理的に遮断されること。"
    - "責任の明確化: A-004〜007に基づき、誰が資産の権利を持ち、誰が構築を代行するかが明記されていること。"
    - "NWMA思想との整合性: A-Noが『意志(Why)→実装(How)→試験(Evidence)』を貫通し、例外が期限管理されていること。"
  GP-002_operational_rules:
    - "Zero Drift Policy: IaC外の手動変更を『資産の汚染』と定義し、検知時は自動是正（C-Sheet）を試行すること。"
    - "Persistence: ツリー構造、URL参照リスト、および失敗時のリカバリ手順の省略は『禁忌』とする。"
  GP-003_system_standards:
    - "Exception Governance: すべての特例設定には承認者と有効期限を紐付け、期限超過時は自動剥奪または警告を執行すること。"

# 資産の三位一体 (The Triplets)
artifacts:
  A_Sheet: "Intent (意志と責任の資産化 - 統治憲法)"
  B_Sheet: "Structure (構造の正本 - 物理執行図)"
  C_Sheet: "Enforcement (自律的な証明 - 強制執行ドリル)"
